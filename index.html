<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habit Tracker" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Habit Tracker</title>

    <!--
      Habit Tracker – one file for desktop (Electron), web (PWA) and phone (APK).
      1. style      looks of the app, split into sections
      2. body       the fixed frame: sidebar, main area, phone bottom bar
      3. script #1  crash reports, bug reports and update checks (loads first)
      4. script #2  the app itself: data, ranks, tasks, projects, notes, views
      All data is kept on the device (localStorage key "ht1").
    -->

    <style>
      /* ===== Theme colours and base elements ===== */
      :root {
        --bg: #090d16;
        --sd: #0b101b;
        --cd: #0f1522;
        --ln: #1b2333;
        --tx: #eef1f8;
        --mu: #7a8499;
        --ac: #8b7cf6;
        --ok: #4ade9a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          13px Inter,
          'Segoe UI',
          'Noto Sans',
          sans-serif;
        background: var(--bg);
        color: var(--tx);
        display: flex;
        height: 100vh;
      }

      /* ===== Sidebar, navigation and focus timer ===== */
      aside {
        width: 190px;
        flex: none;
        background: var(--sd);
        border-right: 1px solid var(--ln);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pf {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 6px 10px;
      }
      #bd {
        cursor: pointer;
        transition: transform 0.15s;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: radial-gradient(#4a3fa0, #141a2c);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 11px;
      }
      .pf small {
        display: block;
        color: var(--mu);
        font-size: 10px;
      }
      .wk {
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--mu);
        padding: 12px 8px 4px;
        text-transform: uppercase;
      }
      .nb {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        background: none;
        border: 0;
        color: var(--tx);
        opacity: 0.75;
        text-align: left;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }
      .nb i {
        width: 20px;
        height: 20px;
        flex: none;
        display: grid;
        place-items: center;
        font-style: normal;
        color: var(--mu);
      }
      .nb i svg {
        width: 20px;
        height: 20px;
      }
      .nb.on {
        background: #171c36;
        opacity: 1;
      }
      .nb.on i {
        color: var(--ac);
      }
      .nb:hover {
        opacity: 1;
      }
      .sp {
        flex: 1;
      }
      .ft {
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .nm {
        background: none;
        border: 1px solid transparent;
        color: var(--tx);
        font: 600 13px inherit;
        padding: 2px 4px;
        margin-left: -4px;
        width: 112px;
        border-radius: 6px;
      }
      .nm:hover,
      .nm:focus {
        border-color: var(--ln);
        background: var(--bg);
      }
      .lb {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mu);
        margin-bottom: 6px;
      }
      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
      }
      h1 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--ln);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 1;
      }
      .in {
        padding: 24px 24px 40px;
      }
      h3 {
        font-size: 13px;
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      .card.rank {
        background: linear-gradient(135deg, #171a3a, var(--cd) 60%);
      }
      .g2,
      .g3 {
        display: grid;
        gap: 14px;
        margin-bottom: 14px;
      }
      .g2 {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(auto-fill, minmax(210px, 250px));
        gap: 10px;
      }
      .g2 .card,
      .g3 .card {
        margin: 0;
      }
      .big {
        font-size: 24px;
        font-weight: 700;
        margin: 4px 0 6px;
      }
      .mu {
        color: var(--mu);
        font-size: 11px;
      }
      .ac {
        color: var(--ac);
        font-size: 11px;
      }
      .ok {
        color: var(--ok);
      }
      .sh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 22px 0 10px;
      }
      .bar {
        height: 6px;
        background: var(--ln);
        border-radius: 4px;
        overflow: hidden;
        margin: 8px 0 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #7c6cf0, var(--ok));
      }
      /* ===== Statistics ===== */
      .sth {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .stg4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .stt {
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stt b {
        font-size: 24px;
      }
      .up {
        color: var(--ok);
      }
      .dn {
        color: #f87171;
      }
      .stc {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 150px;
      }
      .stc > div {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: stretch;
        gap: 4px;
        min-width: 0;
      }
      .stc i {
        display: block;
        border-radius: 4px 4px 1px 1px;
      }
      .stc small {
        font-size: 9px;
        color: var(--mu);
        text-align: center;
        height: 11px;
        white-space: nowrap;
        display: flex;
        justify-content: center;
      }
      .sthb {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) auto;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        font-size: 13px;
      }
      .sthb > span {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .sthb > i {
        height: 8px;
        border-radius: 4px;
        background: var(--ln);
        overflow: hidden;
      }
      .sthb > i > em {
        display: block;
        height: 100%;
        background: #4dabf7;
        border-radius: 4px;
      }
      .sthr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        border-top: 1px solid var(--ln);
        font-size: 13px;
      }
      .sthr:first-of-type {
        border-top: 0;
      }
      .sthr > span:not(.sdots) {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .sdots {
        display: flex;
        gap: 2px;
      }
      .sdots i {
        width: 6px;
        height: 14px;
        border-radius: 2px;
        background: var(--ln);
      }
      .sdots i.d {
        background: var(--ok);
      }
      .sdots i.m {
        background: #f8717188;
      }
      @media (max-width: 760px) {
        .sdots {
          display: none;
        }
      }
      .ic {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--ln);
        display: grid;
        place-items: center;
        font-style: normal;
      }
      .ck {
        width: 20px;
        height: 20px;
        border: 1.5px solid #3a4258;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 12px;
      }
      .ck.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #06140d;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--ln);
      }
      .row span {
        flex: 1;
      }
      .done {
        color: var(--ok);
      }
      input,
      select,
      textarea {
        background: var(--bg);
        border: 1px solid var(--ln);
        color: var(--tx);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--ac);
      }
      textarea {
        width: 100%;
        min-height: 110px;
      }
      .b {
        background: var(--ac);
        color: #0b0a1c;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        font: 600 13px inherit;
      }
      .s {
        background: var(--cd);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
        text-align: center;
      }
      .cal > div {
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 6px 0;
        min-height: 62px;
      }
      .cal > div.td {
        border-color: var(--ac);
      }
      .cal b,
      .cal span,
      .cal small {
        display: block;
      }
      .cal small {
        color: var(--mu);
        font-size: 10px;
      }
      .sw {
        width: 44px;
        height: 24px;
        border-radius: 12px;
        background: var(--ln);
        position: relative;
        cursor: pointer;
        flex: none;
      }
      .sw i {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s;
      }
      .sw.on {
        background: var(--ac);
      }
      .sw.on i {
        left: 23px;
      }
      .tag {
        font-style: normal;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--ln);
        display: inline-block;
      }
      .cal .tag {
        display: block;
        margin: 3px 4px 0;
      }
      .cal > div[onclick] {
        cursor: pointer;
      }
      .cal > div[onclick]:hover {
        border-color: #8b7cf680;
      }
      /* calendar: the window of a day and the event form */
      .cel {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cei {
        display: flex;
        gap: 10px;
        align-items: stretch;
        text-align: left;
        border: 1px solid var(--ln);
        background: var(--bg);
        color: var(--tx);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        cursor: pointer;
      }
      .cei > i {
        width: 4px;
        border-radius: 2px;
        background: var(--c);
        flex: none;
      }
      .cei > span {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .cef {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        flex-wrap: wrap;
      }
      .cef .clb {
        width: 80px;
        font-size: 13px;
        color: var(--mu);
      }
      .cet {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cec {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cei a.cemap {
        font-size: 12px;
        color: #6cb6ff;
        cursor: pointer;
        text-decoration: none;
      }
      .cei .cez {
        font-size: 12.5px;
        color: var(--tx);
        white-space: pre-wrap;
        margin-top: 2px;
      }
      #cem .chip {
        border-color: color-mix(in srgb, var(--c) 45%, transparent);
      }
      #cem .chip.on {
        background: color-mix(in srgb, var(--c) 25%, transparent);
        color: var(--tx);
      }
      /* calendar page: toolbar, week / day hours, Coming up */
      .cvl {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 14px;
        align-items: start;
      }
      .cvl > .card {
        margin-bottom: 0;
      }
      .cvb {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .cvn2 {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 200px;
      }
      .cvn2 b {
        text-align: center;
      }
      .cvo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cvk {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--mu);
        cursor: pointer;
      }
      .cvg {
        --t: 46px;
      }
      .cvh,
      .cva {
        display: grid;
        grid-template-columns: var(--t) repeat(var(--n), minmax(0, 1fr));
        gap: 4px;
      }
      .cvh button {
        border: 0;
        background: none;
        color: var(--mu);
        font: inherit;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4px 0;
        border-radius: 8px;
      }
      .cvh button b {
        font-size: 18px;
        color: var(--tx);
      }
      .cvh button.td b {
        color: var(--ac);
      }
      .cva {
        border-top: 1px solid var(--ln);
        border-bottom: 1px solid var(--ln);
        padding: 4px 0;
        min-height: 30px;
        align-items: start;
      }
      .cva > small {
        font-size: 10px;
        align-self: center;
      }
      .cva > div {
        cursor: pointer;
        min-height: 22px;
      }
      .cva .tag {
        display: block;
        margin: 2px 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cvs {
        display: grid;
        grid-template-columns: var(--t) repeat(var(--n), minmax(0, 1fr));
        gap: 4px;
        height: 560px;
        overflow-y: auto;
        position: relative;
      }
      .cvt {
        position: relative;
      }
      .cvt small {
        position: absolute;
        right: 6px;
        transform: translateY(-50%);
        font-size: 10px;
        color: var(--mu);
      }
      .cvt small:first-child {
        transform: none;
      }
      .cvd {
        position: relative;
        border-left: 1px solid var(--ln);
        cursor: copy;
      }
      .cvd.td {
        background: #8b7cf60d;
      }
      .cvd > i {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid #ffffff0d;
        pointer-events: none;
      }
      .cvx,
      .cvw {
        position: absolute;
        border-radius: 6px;
        padding: 3px 6px;
        font-size: 11px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        box-sizing: border-box;
      }
      .cvx {
        background: color-mix(in srgb, var(--c) 28%, var(--cd));
        border-left: 3px solid var(--c);
        color: var(--tx);
        z-index: 2;
      }
      .cvx small {
        color: var(--mu);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cvw {
        left: 0;
        right: 0;
        background: repeating-linear-gradient(135deg, #60a5fa1a 0 6px, #60a5fa0d 6px 12px);
        border: 1px dashed #60a5fa66;
        color: #93c5fd;
        z-index: 1;
        cursor: default;
      }
      .cvw {
        overflow: visible;
      }
      .cvw > span {
        position: sticky;
        top: 2px;
      }
      .cvn {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 2px solid #f87171;
        z-index: 3;
        pointer-events: none;
      }
      /* reminders: number + D/H */
      .cer .cerx {
        border: 0;
        background: none;
        color: var(--mu);
        cursor: pointer;
        font: inherit;
        padding: 4px 6px;
      }
      #cem .chip.clp {
        --c: var(--ac);
        padding: 6px 10px;
        font-weight: 700;
      }
      /* places: suggestions under the field */
      .geo {
        position: relative;
        display: flex;
        flex: 1;
        min-width: 0;
      }
      .geo > input {
        flex: 1;
        min-width: 0;
      }
      .geop {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        z-index: 60;
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 4px;
        box-shadow: 0 10px 30px #0006;
        display: flex;
        flex-direction: column;
      }
      .geop button {
        text-align: left;
        background: none;
        border: 0;
        color: var(--tx);
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .geop button:hover {
        background: var(--ln);
      }
      /* weather */
      .wxcard {
        grid-column: 1;
        margin-bottom: 0;
      }
      .cvl > .cvside {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
      .wxh {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .wxa {
        margin: 8px 0 0;
      }
      .wxp + .wxp {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--ln);
      }
      .wxn {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .wxn > span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      .wxn svg {
        width: 15px;
        height: 15px;
        color: var(--ac);
        flex: none;
      }
      .wxx {
        border: 0;
        background: none;
        color: var(--mu);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .wxx:hover {
        background: var(--ln);
      }
      .wxg {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .wxg.w14 {
        row-gap: 10px;
      }
      .wxg > div {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 8px 6px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--ln) 60%, transparent);
        text-align: center;
        min-width: 0;
      }
      .wxg > div.td {
        outline: 1.5px solid var(--ac);
        outline-offset: -1.5px;
      }
      .wxg i {
        font-style: normal;
        line-height: 0;
        margin: 1px 0;
      }
      .wxg svg {
        width: 36px;
        height: 34px;
      }
      .wxg b {
        font-size: 15px;
      }
      .wxg small {
        font-size: 11px;
      }
      .wxg .wxd {
        font-weight: 600;
      }
      .wxl,
      .wxv {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .wxl {
        align-items: flex-start;
      }
      .wxv {
        align-items: flex-end;
        text-align: right;
        white-space: nowrap;
      }
      .wxu {
        color: #8fd3c8;
      }
      .wxr {
        color: #6cb6ff;
      }
      .wxs {
        display: block;
        margin-top: 6px;
        font-size: 10px;
        text-align: right;
      }
      /* Coming up: period and label filter */
      .cuob {
        display: none;
      }
      /* phone: Coming up slides in from the left */
      #cud {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: #0000;
        transition: background 0.2s;
      }
      #cud.on {
        background: #0008;
      }
      #cud.r .cudp {
        left: auto;
        right: 0;
        border-right: 0;
        border-left: 1px solid var(--ln);
        transform: translateX(100%);
      }
      #cud.r.on .cudp {

      }
      .evcb {
        display: flex;

      .updn {
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #ffd43b55;
        background: #ffd43b14;
        border-radius: 12px;

        margin: 4px 0 8px;

      /* What's new */

      }

      }

        margin-bottom: 14px;
      }
      .nwh small {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        color: var(--ac);
      }
      .nwh h3 {
        margin: 2px 0 0;
        font-size: 20px;
      }
      .nwg {
        border: 1px solid var(--ln);

        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .nwt i {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;

        width: 17px;
        height: 17px;
      }

        overflow-wrap: anywhere;

      .chips {

      /* ===== Tasks & projects: forms, chips, project cards ===== */
      .chip {
        background: var(--cd);
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 20px;
        padding: 6px 13px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .chip:hover {
        border-color: var(--ac);
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #0b0a1c;
        font-weight: 600;
      }
      .sub {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }
      .sub input {
        flex: 1;
        min-width: 0;
      }
      .sub.rem input {
        flex: none;
        width: 84px;
      }
      .fl {
        margin-top: 16px;
      }
      .lk {
        opacity: 0.5;
      }
      input:disabled {
        cursor: not-allowed;
      }
      .tkr {
        padding: 9px 0;
        border-top: 1px solid var(--ln);
      }
      .tkm {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tkb {
        flex: 1;
        min-width: 0;
      }
      .tkb b,
      .tkb small {
        display: block;
        overflow-wrap: anywhere;
      }
      .tks {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 7px 0 0 28px;
        font-size: 12px;
      }
      .od {
        color: #f87171;
      }
      #toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 90;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast {
        background: var(--cd);
        border: 1px solid var(--ac);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 290px;
        box-shadow: 0 10px 30px #000a;
      }
      .toast .s {
        align-self: flex-end;
      }
      .mt {
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
        background: #0b101b;
      }
      .mn {
        font-weight: 600;
      }
      .mt .sub:first-child {
        margin-bottom: 6px;
      }
      .sub.ss,
      .mt > button.ss {
        margin-left: 22px;
      }
      .mt > button.ss {
        margin-top: 0;
      }
      .cdg {
        display: grid;
        grid-template-columns: repeat(7, 36px);
        gap: 5px;
      }
      .cdb {
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--ln);
        background: var(--cd);
        color: var(--tx);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .cdb:hover {
        border-color: var(--ac);
      }
      .cdb.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #0b0a1c;
        font-weight: 700;
      }
      .tss {
        margin-left: 52px;
      }
      .mnl {
        font-weight: 600;
      }
      .pc {
        cursor: pointer;
      }
      .pc:hover {
        border-color: var(--ac);
      }
      .pst {
        display: inline-flex;
        align-items: center;
        line-height: 1;
        font-size: 10px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 12px;
        background: var(--ln);
        color: var(--mu);
        white-space: nowrap;
      }
      .pst.ok {
        background: #4ade9a22;
        color: var(--ok);
      }
      .pds {
        opacity: 0.85;
        margin: 4px 0 10px;
        white-space: pre-wrap;
        line-height: 1.5;
        max-width: 75ch;
      }
      .pgr {
        display: grid;
        grid-template-columns: 1fr 230px;
        gap: 20px;
        align-items: end;
        margin-top: 8px;
      }
      .pfo {
        border-left: 1px solid var(--ln);
        padding-left: 18px;
      }
      .pfo .s {
        margin-top: 4px;
      }
      .msh {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .msh b {
        font-size: 14px;
      }
      .ptr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--ln);
      }
      .ptr label {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        cursor: pointer;
      }
      .ptr label span {
        overflow-wrap: anywhere;
      }
      .pts {
        margin-left: 26px;
        border-top: 0;
        padding: 3px 0;
      }
      .pts > input.pin {
        flex: 1;
      }
      .sw3 {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .sw3.on {
        border-color: #fff;
        box-shadow: 0 0 0 2px var(--ac);
      }
      .pmt {
        display: block;
        margin: -2px 0 8px 2px;
      }
      .sub input[maxlength='10'] {
        flex: none;
        width: 120px;
      }
      .cal .tag {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ov,
      #bn,
      .mo {
        display: none;
      }
      .hb {
        background: none;
        border: 0;
        color: var(--tx);
        width: 38px;
        height: 38px;
        margin-left: -8px;
        border-radius: 10px;
        cursor: pointer;
        place-items: center;
      }
      .hb svg {
        width: 22px;
        height: 22px;
      }
      .hbd {
        cursor: pointer;
        margin: 6px 6px 6px 10px;
      }

      /* ===== Phone layout (narrow screens) ===== */
      @media (max-width: 760px) {
        body {
          display: block;
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
          font-size: 14px;
        }
        main {
          overflow: visible;
        }
        aside {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: min(84vw, 300px);
          z-index: 56;
          transform: translateX(-105%);
          transition: transform 0.22s ease;
          overflow-y: auto;
          padding-top: calc(16px + env(safe-area-inset-top));
          padding-bottom: calc(16px + env(safe-area-inset-bottom));
          box-shadow: 8px 0 30px #0008;
        }
        body.drw aside {
          transform: none;
        }
        #ov {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 55;
          background: #000a;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        body.drw #ov {
          opacity: 1;
          pointer-events: auto;
        }
        .mo {
          display: inline-grid;
        }
        h1 {
          gap: 6px;
          font-size: 17px;
          padding: 8px 12px;
          padding-top: calc(8px + env(safe-area-inset-top));
          z-index: 5;
        }
        h1 .ttl {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .in {
          padding: 14px 14px calc(86px + env(safe-area-inset-bottom));
        }
        #bn {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: 1fr;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 50;
          background: var(--sd);
          border-top: 1px solid var(--ln);
          padding-bottom: env(safe-area-inset-bottom);
        }
        .bnb {
          background: none;
          border: 0;
          color: var(--mu);
          font: inherit;
          font-size: 10px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          padding: 8px 0 7px;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
          min-width: 0;
        }
        .bnb span {
          max-width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .bnb svg {
          width: 22px;
          height: 22px;
        }
        .bnb.on {
          color: var(--ac);
        }
        .g2,
      .g3,
      .gn,
      .gn2 {
          grid-template-columns: 1fr !important;
        }
        .big {
          font-size: 21px;
        }
        .card {
          padding: 13px 14px;
        }
        .dgb small {
          font-size: 9px;
        }
        /* phone: short focus label (2:20) so the numbers above the narrow bars do not run into each other */
        .dgb .fl {
          display: none;
        }
        .dgb .fs {
          display: inline;
        }
        .l7:not(.m) {
          grid-template-columns: repeat(7, minmax(100px, 1fr));
          overflow-x: auto;
          padding-bottom: 6px;
          -webkit-overflow-scrolling: touch;
        }
        /* phone: focus time stays on the right of the project % */
        .pgr {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 12px;
        }
        .pgr .big {
          font-size: 28px !important;
        }
        .pfo {
          padding-left: 12px;
        }
        .pfo .big {
          font-size: 20px !important;
        }
        .pfo .s {
          font-size: 11px;
          padding: 5px 8px;
        }
        #md,
      #cem,
      #nm,
      #tk,
      #pm,
      #tgm,
      #im,
      #wkm,
      #br {
          padding: 0;
          place-items: end stretch;
        }
        .mp {
          width: 100% !important;
          max-width: 100%;
          max-height: 94vh;
          max-height: 94dvh;
          border-radius: 18px 18px 0 0;
          padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
        }
        input,
      select,
      textarea {
          font-size: 16px;
        }
        .nm {
          font-size: 14px;
        }
        .s {
          min-height: 34px;
          padding: 6px 12px;
        }
        .chip {
          padding: 8px 14px;
          font-size: 13px;
        }
        .cdb {
          height: 38px;
        }
        .cdg {
          grid-template-columns: repeat(7, 1fr);
        }
        input[type='checkbox'] {
          width: 20px;
          height: 20px;
          flex: none;
        }
        .sh {
          flex-wrap: wrap;
          gap: 8px;
        }
        .cal {
          gap: 3px;
        }
        .cal > div {
          min-height: 56px;
          padding: 4px 0;
          border-radius: 8px;
        }
        .cal small {
          font-size: 9px;
        }
        .cal .tag {
          font-size: 8px;
          padding: 1px 3px;
          margin: 2px 2px 0;
        }
        #toasts {
          left: 12px;
          right: 12px;
          bottom: calc(74px + env(safe-area-inset-bottom));
        }
        .toast {
          width: auto;
        }
        .sub input[maxlength='10'] {
          width: 112px;
        }
        .tkm {
          flex-wrap: wrap;
        }
        .tkb {
          flex-basis: 60%;
        }
        #pm .sub {
          flex-wrap: wrap;
        }
        #pm .sub > .mn {
          flex-basis: 100%;
        }
        #pm .sub > input[maxlength='10'] {
          flex: 1;
        }
        .tb {
          font-size: 12px;
        }
      }
      .upd {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        border-color: var(--ac);
        background: linear-gradient(90deg, #8b7cf622, var(--cd));
      }
      .updb {
        display: flex;
        gap: 8px;
        flex: none;
      }
      .brc {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 12px;
        font-size: 12px;
        color: var(--mu);
        cursor: pointer;
        line-height: 1.4;
      }
      .brc input {
        margin-top: 1px;
      }
      @media (max-width: 760px) {
        .upd {
          flex-wrap: wrap;
        }
        .updb {
          width: 100%;
          justify-content: flex-end;
        }
      }

      /* ===== Dashboard: project board and tasks table ===== */
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
        gap: 24px;
        margin-top: 24px;
        align-items: start;

      .split .sh {

        grid-template-columns: repeat(3, minmax(0, 1fr));

        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 8px;

        padding: 3px 4px 9px;
      }

        font-size: 12px;
      }
      .bcn {
        font-size: 10px;
        color: var(--mu);
        background: var(--ln);
        border-radius: 10px;
        padding: 1px 8px;
      }
      .bc-todo .bch b {
        color: #aab4c6;
      }

        color: var(--ac);
      }

        background: var(--cd);
        border: 1px solid var(--ln);
        border-left: 3px solid var(--pc);
        border-radius: 10px;
        padding: 9px 10px;
        margin-bottom: 8px;
        cursor: grab;
        display: flex;
        flex-direction: column;
        gap: 5px;

        position: relative;
      }

        position: absolute;
        top: 6px;
        right: 6px;
        width: 20px;
        height: 22px;
        color: var(--mu);
        cursor: grab;
        touch-action: none;
        opacity: 0.6;
      }
      .bgr:hover {
        opacity: 1;
      }
      .bgr svg {
        width: 18px;
        height: 20px;
        fill: currentColor;
      }
      .bcard.ndrag {
        opacity: 0.45;
      }
      .bcard.dz {
        outline: 2px dashed var(--ac);
        outline-offset: 2px;
      }
      .bcard:hover {
        border-color: #3a4258;
        border-left-color: var(--pc);
      }
      .bcard:active {
        cursor: grabbing;
      }
      .bct {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        align-items: flex-start;
      }
      .bct b {
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .bcp {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bcp span {
        font-weight: 700;
        font-size: 13px;
        min-width: 34px;
      }
      .bcp .bar {
        flex: 1;
        margin: 0;

      .bcf {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .bcf span {
        display: flex;
        gap: 4px;
        flex: none;
      }
      .bcf small {
        white-space: nowrap;
      }
      .bmv {
        background: none;
        border: 1px solid var(--ln);
        color: var(--tx);
        border-radius: 6px;
        width: 24px;
        height: 22px;
        cursor: pointer;
        line-height: 1;
        padding: 0;
        font: inherit;
      }
      .bmv:hover:not(:disabled) {

      .bce {
        padding: 4px 4px 10px;
        font-size: 11px;
      }
      .badd {

        margin-top: 2px;
      }
      .seg3 {

        background: var(--ln);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .seg3 button {
        background: none;
        border: 0;
        color: var(--mu);
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }

        background: var(--ac);
        color: #0b0a1c;
        font-weight: 600;

      .tsub {

      .ttw {
        padding: 0;

        font-size: 12px;
      }
      .ttab th {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mu);
        font-weight: 500;
        text-align: left;
        padding: 10px 8px 8px;
        border-bottom: 1px solid var(--ln);

      .ttab .r {

      .ttab .c {

        white-space: nowrap;

    <script>
// ---- app identity, crash capture and report delivery (runs before the app so it also sees start-up errors) ----
// gh = public GitHub repository whose Releases hold the new versions · hook = Discord webhook URL
const APP = { code: 11, name: '2.0', wkey: '', gh: 'MrJackyYT/habit-tracker-releases', hook: 'https://discord.com/api/webhooks/1567208679311151155/OckNM4kTJOeJrgl8RS5fpdMk3XntmAJ3ISK1Ww0GJ4VF4HyYqRw8xqF4fQOA3MAGJo4O' };
// what is new in this version: { sl: [[group, [points]]], en: […] }, written by .github/set-version.py (release)
// or make-dev.py (dev build); the app shows the list of its language
const NEWS = {"sl": [["Koledar", ["Odpravljena težava pri dodajanju dogodkov in pisanju v okvirčke, dodatne novosti", "Nov videz koledarja", "Dogodki čez več dni – prvi klik označi dan, drugi ga odpre, klik na kasnejši dan ustvari dogodek čez več dni", "Kategorija Prihaja s filtri po oznakah (na telefonu podrsaš v levo)", "[NOVO] Vremenska napoved za 7/14 dni za do 3 različne kraje, vključno s temperaturo, dežjem in vlažnostjo", "Vremensko napoved na telefonu odpreš s potegom v desno"]], ["Opravila", ["Opomniki pred vsakim dnem, ko je opravilo na vrsti"]], ["Projekti", ["»Rok« je nadomestil »Konec« in ti po želji prikaže tudi opomnik", "Projekte na plošči razporediš sam – ročico ⠿ povlečeš na drug projekt"]], ["Zapiski", ["Iskanje po naslovih", "Zapiske razporediš sam – povlečeš na drug zapisek", "Zvezdica za pomembne zapiske, ki dobijo svojo vrstico na vrhu"]], ["Evidenčni list", ["Odstranjeni gumbi za Dopust, Bolniško, Delo in Kolektivni dopust", "Klikni prvi in zadnji dan, nato se prikaže okno za izbiro", "Prednastavitve lahko urejaš in brišeš", "Klik na izpolnjen dan ga odstrani ali mu doda delo"]], ["Fokus", ["Ročno vnašanje naslova – čas lahko šteješ tudi brez projekta ali opravila", "Stikalo ob polju za izbiro med projektom/opravilom in lastnim naslovom", "Sistemskih programov, gonilnikov, protivirusnih programov in vgrajenih aplikacij telefona ni več mogoče blokirati"]], ["Podatki", ["Na telefonu kopija podatkov v Dokumenti › Habit Tracker", "V Nastavitvah piše, kje je nameščena aplikacija"]]], "en": [["Calendar", ["Fixed adding events and typing in the fields, plus more new features", "A new look for the calendar", "Events over several days – the first click selects a day, the second opens it, a click on a later day makes an event over those days", "Coming up with filters by label (on the phone, swipe left)", "[NEW] Weather forecast for 7/14 days for up to 3 places, with temperature, rain and humidity", "On the phone, swipe right to open the weather forecast"]], ["Tasks", ["Reminders before each day a task is due"]], ["Projects", ["\"End\" is replaced by \"Deadline\", which can also give you a reminder", "Put projects on the board in your own order – drag the ⠿ handle onto another project"]], ["Notes", ["Search in titles", "Put your notes in your own order – drag one onto another", "A star for important notes, which get their own row on top"]], ["Evidence list", ["The Vacation, Sick leave, Work and Collective leave buttons are gone", "Click the first and the last day, then a window lets you choose", "Presets can be edited and deleted", "A click on a filled day removes it or adds work to it"]], ["Focus", ["Type your own title – count time without a project or task", "A switch next to the field to choose a project/task or your own title", "System programs, drivers, antivirus programs and the phone's built-in apps can no longer be blocked"]], ["Data", ["On the phone a copy of your data in Documents › Habit Tracker", "Settings show where the app is installed"]]]};
const NW = () => (Array.isArray(NEWS) ? NEWS : NEWS[LANG()] || NEWS.sl || []);
const DG = { errs: [], sent: {}, q: 'ht_rq', day: 'ht_rd' };
const hookOk = () => /^https?:\/\/\S+$/.test(APP.hook);
const devInfo = () => {
  try {
    if (window.HTNative && HTNative.device) return HTNative.device();
  } catch (e) {}
  return navigator.userAgent;
};
const platform = () =>
  window.HTNative
    ? 'Android app'
    : window.Capacitor
      ? 'Capacitor app'
      : location.protocol === 'file:'
        ? 'Desktop app'
        : matchMedia('(display-mode: standalone)').matches
          ? 'Installed web app'
          : 'Browser';
const rqGet = () => {
  try {
    return JSON.parse(localStorage.getItem(DG.q)) || [];
  } catch (e) {
    return [];
  }
};
const rqSet = l => {
  try {
    localStorage.setItem(DG.q, JSON.stringify(l.slice(-20)));
  } catch (e) {}
};
const postHook = async p => {
  const fd = new FormData();
  fd.append('payload_json', JSON.stringify(p));
  await fetch(APP.hook, { method: 'POST', body: fd, mode: 'no-cors' });
};
const report = async p => {
  if (!hookOk() || !navigator.onLine) {
    rqSet([...rqGet(), p]);
    return 'queued';
  }
  try {
    await postHook(p);
    return 'sent';
  } catch (e) {
    rqSet([...rqGet(), p]);
    return 'queued';
  }
};
const flushQ = async () => {
  if (!hookOk() || !navigator.onLine) return;
  const l = rqGet();
  if (!l.length) return;
  rqSet([]);
  const left = [];
  for (const p of l) {
    try {
      await postHook(p);
    } catch (e) {
      left.push(p);
    }
  }
  if (left.length) rqSet([...rqGet(), ...left]);
};
const embed = (title, desc, color, extra, diag = true) => ({
  username: 'Habit Tracker',
  embeds: [
    {
      title: String(title).slice(0, 250),
      description: String(desc || '').slice(0, 3800),
      color,
      fields: [
        ...(diag
          ? [
              ['App', APP.name + ' (' + APP.code + ')'],
              ['Platform', platform()],
              ['Device', devInfo()]
            ]
          : []),
        ...(extra || [])
      ].map(([n, v]) => ({
        name: n,
        value: String(v || '-').slice(0, 1000),
        inline: !/Recent errors|Stack/.test(n)
      })),
      timestamp: new Date().toISOString()
    }
  ]
});
const autoOn = () => {
  try {
    return (JSON.parse(localStorage.getItem('ht1') || '{}') || {}).diag !== false;
  } catch (e) {
    return true;
  }
};
const crashed = (msg, stack, kind) => {
  msg = String(msg);
  DG.errs.push({ t: new Date().toTimeString().slice(0, 8), msg: msg.slice(0, 300) });
  if (DG.errs.length > 8) DG.errs.shift();
  if (!autoOn() || DG.sent[msg]) return;
  DG.sent[msg] = 1;
  const today = new Date().toLocaleDateString('sv');
  let c = {};
  try {
    c = JSON.parse(localStorage.getItem(DG.day)) || {};
  } catch (e) {}
  if (c.d !== today) c = { d: today, n: 0 };
  if (c.n >= 5) return;
  c.n++;
  try {
    localStorage.setItem(DG.day, JSON.stringify(c));
  } catch (e) {}
  report(
    embed('💥 ' + (kind || 'Crash') + ': ' + msg.slice(0, 200), '', 0xe5484d, [
      ['Stack', '```' + String(stack || msg).slice(0, 950) + '```']
    ])
  );
};
window.addEventListener('error', e =>
  crashed(
    (e.message || 'Error') +
      (e.filename ? ' @ ' + e.filename.split('/').pop().split('?')[0].slice(0, 40) + ':' + e.lineno : ''),
    e.error && e.error.stack,
    'Crash'
  )
);
window.addEventListener('unhandledrejection', e => {
  const r = e.reason || {};
  crashed('Unhandled promise: ' + (r.message || r), r.stack, 'Crash');
});
window.addEventListener('online', () => flushQ());
setInterval(() => flushQ(), 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) flushQ();
});

const remAll = (d0, n) => {
  const out = [],

    };

    (ceLen(x) && ceStart(x, d) !== d ? [] : ceAts(x, d)).forEach(({ at, m }) =>
      out.push({ k: 'ce|' + x.id + '|' + d, at, m, st: new Date(d + 'T' + (x.t || '23:59') + ':00'), title: (ceLab(x)?.i || '📅') + ' ' + x.n, body: ceWhen(x, d) + (x.loc ? ' · ' + x.loc : '') })
    )

  const k = new Date(d0 + 'T12:00');
  for (let i = 0; i < n; i++, k.setDate(k.getDate() + 1)) {
    const d = D(k);
    S.t.filter(t => (t.rs || []).length && isRec(t) && !t.ar && hdue(t, d) && S.l[d]?.[t.id] !== 'd').forEach(t =>
      t.rs.forEach(m => out.push({ k: 'tk|' + t.id + '|' + d, at: at9(d, m), m, st: new Date(d + 'T23:59:00'), title: '✅ ' + t.n, body: fdt(d) }))

    p.rs.forEach(m => out.push({ k: 'pj|' + p.id + '|' + p.due, at: at9(p.due, m), m, st: new Date(p.due + 'T23:59:00'), title: '📁 ' + p.n, body: 'Deadline ' + fdt(p.due) }))

const clean = h => {

  const ok = ['B', 'STRONG', 'I', 'EM', 'U', 'SPAN', 'FONT', 'UL', 'OL', 'LI', 'BR', 'DIV', 'P', 'MARK'],
